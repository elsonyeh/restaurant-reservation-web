<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的收藏｜SIWAN TABLE 西灣食記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/config.js"></script>
</head>
<body class="page">
<main class="wrap" style="padding-top:64px;padding-bottom:96px">
  <div style="padding-bottom:28px;border-bottom:1px solid var(--ink)">
    <p class="eyebrow">FAVORITES</p>
    <h1 class="page-title">我的收藏</h1>
  </div>
  <div class="cols" style="padding-top:40px">
    <aside class="col" aria-label="收藏清單" style="flex:1 1 280px;display:flex;flex-direction:column;gap:28px">
      <ul id="lists" style="margin:0;padding:0;list-style:none"></ul>
      <form id="new-form" class="form" style="gap:14px;border-top:1px solid var(--line);padding-top:24px">
        <p style="margin:0;font-size:17px;font-weight:500" id="form-title">新增清單</p>
        <label class="field">清單名稱<input type="text" name="fName" required maxlength="50" placeholder="例如：期末考後慶功"></label>
        <label class="field">說明（選填）<input type="text" name="description" maxlength="200"></label>
        <label class="check"><input type="checkbox" name="isPublic">公開這份清單</label>
        <p class="msg err" id="new-msg" hidden></p>
        <div class="row" style="gap:10px">
          <button type="submit" class="btn btn-outline">儲存</button>
          <button type="button" class="btn btn-quiet" id="form-reset" hidden>取消編輯</button>
        </div>
      </form>
    </aside>
    <section class="col wide" aria-labelledby="cur-h" style="flex:3 1 480px">
      <div id="current"><p class="loading">載入中…</p></div>
    </section>
  </div>
</main>
<script type="module">
  import { api, esc, priceHtml, showMsg, toast, requireLogin, $ } from './assets/js/api.js';
  import { renderLayout } from './assets/js/layout.js';
  if (requireLogin()) {
    renderLayout('favorites');
    let lists = [];
    let sel = null;
    let editingId = null;
    const form = $('#new-form');

    async function load() {
      ({ items: lists } = await api('/me/favlists'));
      if (!lists.find((l) => l.fid === sel)) sel = lists[0]?.fid || null;
      render();
    }

    function render() {
      $('#lists').innerHTML = lists.map((l) => `
        <li><button type="button" data-sel="${esc(l.fid)}" aria-pressed="${l.fid === sel}"
          style="width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-left:2px solid ${l.fid === sel ? 'var(--rose)' : 'transparent'};background:${l.fid === sel ? 'var(--blush)' : '#fff'};padding:16px;cursor:pointer;min-height:64px">
          <span style="display:block;font-size:17px;font-weight:500">${esc(l.fname)}</span>
          <span class="small">${l.n} 家・${l.ispublic ? '公開' : '不公開'}</span>
        </button></li>`).join('') || '<li class="small" style="padding:8px 0">還沒有收藏清單。</li>';

      const cur = lists.find((l) => l.fid === sel);
      $('#current').innerHTML = !cur ? '<p class="empty">在左邊建立第一份清單，再到餐廳頁按「加入收藏」。</p>' : `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 24px">
          <h2 id="cur-h" style="margin:0;font-size:24px;font-weight:500;letter-spacing:.04em">${esc(cur.fname)}</h2>
          <div style="display:flex;gap:20px">
            <button type="button" class="link-btn" id="edit-list">編輯清單</button>
            <button type="button" class="link-btn quiet" id="del-list">刪除清單</button>
          </div>
        </div>
        <p style="margin:8px 0 12px;font-size:15px;color:var(--muted)">${esc(cur.description || '')}</p>
        <ul style="margin:0;padding:0;list-style:none">
          ${cur.restaurants.map((r) => `
          <li style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:24px 0;border-bottom:1px solid var(--line)">
            <div style="flex:1 1 240px;display:flex;flex-direction:column;gap:6px;min-width:0">
              <a href="restaurant.html?id=${encodeURIComponent(r.rid)}" style="font-size:19px;font-weight:500">${esc(r.rname)}</a>
              <span class="small" style="font-size:14px">${esc(r.district)}</span>
            </div>
            <span style="flex:0 0 64px;font-family:var(--sans);font-size:15px;letter-spacing:.08em">${priceHtml(r.pricerange)}</span>
            <span style="flex:0 0 72px;font-size:17px;font-weight:500">★ ${r.google_rate ?? '—'}</span>
            <button type="button" class="link-btn quiet" data-remove="${esc(r.rid)}">移出清單</button>
          </li>`).join('') || '<li class="empty">清單裡還沒有餐廳。</li>'}
        </ul>
        <a href="index.html" style="display:inline-flex;margin-top:28px;font-size:15px;color:var(--rose-dark);border-bottom:1px solid var(--rose);padding:8px 0">去探索更多餐廳</a>`;
    }

    function resetForm() {
      editingId = null; form.reset();
      $('#form-title').textContent = '新增清單'; $('#form-reset').hidden = true; showMsg($('#new-msg'), '');
    }

    $('#lists').addEventListener('click', (e) => { const b = e.target.closest('[data-sel]'); if (b) { sel = b.dataset.sel; render(); } });
    $('#current').addEventListener('click', async (e) => {
      const cur = lists.find((l) => l.fid === sel);
      if (e.target.id === 'edit-list') {
        editingId = cur.fid; form.fName.value = cur.fname; form.description.value = cur.description || ''; form.isPublic.checked = cur.ispublic;
        $('#form-title').textContent = '編輯清單'; $('#form-reset').hidden = false; form.fName.focus();
      }
      if (e.target.id === 'del-list') {
        const b = e.target;
        if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '確定刪除整份清單？'; b.style.color = 'var(--err)'; return; }
        try { await api('/favlists/' + encodeURIComponent(cur.fid), { method: 'DELETE' }); toast('清單已刪除'); sel = null; load(); }
        catch (err) { toast(err.message); }
      }
      const rm = e.target.closest('[data-remove]');
      if (rm) {
        try { await api(`/favlists/${encodeURIComponent(cur.fid)}/restaurants/${encodeURIComponent(rm.dataset.remove)}`, { method: 'DELETE' }); load(); }
        catch (err) { toast(err.message); }
      }
    });
    $('#form-reset').addEventListener('click', resetForm);
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { fName: form.fName.value, description: form.description.value, isPublic: form.isPublic.checked };
      try {
        if (editingId) { await api('/favlists/' + encodeURIComponent(editingId), { method: 'PUT', body }); toast('清單已更新'); }
        else { const r = await api('/favlists', { method: 'POST', body }); sel = r.fid; toast('清單已建立'); }
        resetForm(); load();
      } catch (err) { showMsg($('#new-msg'), err.message); }
    });

    load().catch((e) => { $('#current').innerHTML = `<p class="empty">${esc(e.message)}</p>`; });
  }
</script>
</body>
</html>
