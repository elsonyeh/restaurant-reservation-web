<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 / 註冊｜留席 SAVED SEAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20261107b">
<script src="assets/js/config.js?v=20261107b"></script>
</head>
<body class="page">
<main class="marble" style="padding:80px 20px 96px">
  <div style="max-width:1000px;margin:0 auto;background:#fff;padding:64px clamp(24px,5vw,64px)">
    <div style="text-align:center;margin-bottom:56px">
      <p class="eyebrow">MEMBER</p>
      <h1 class="page-title" style="margin-top:16px">會員登入與註冊</h1>
    </div>
    <div class="cols">
      <section class="col" aria-labelledby="login-h">
        <h2 id="login-h" class="h-col">LOGIN</h2>
        <p class="h-col-sub">已經是會員</p>
        <form id="login-form" class="form">
          <label class="field">電子信箱<input type="email" name="email" autocomplete="email" required></label>
          <label class="field">密碼<input type="password" name="password" autocomplete="current-password" required></label>
          <p class="msg err" id="login-msg" role="alert" hidden></p>
          <button type="submit" class="btn" style="letter-spacing:.24em">登入</button>
        </form>
      </section>
      <section class="col" aria-labelledby="reg-h">
        <h2 id="reg-h" class="h-col">REGISTER</h2>
        <p class="h-col-sub">第一次使用，建立帳號</p>
        <form id="reg-form" class="form">
          <label class="field">姓名<input type="text" name="mName" autocomplete="name" required maxlength="100"></label>
          <label class="field">電子信箱<input type="email" name="email" autocomplete="email" required></label>
          <label class="field">密碼（至少 8 個字元）<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
          <div class="row">
            <label class="field">生日<input type="date" name="birthday"></label>
            <label class="field">手機<input type="tel" name="phone" autocomplete="tel" placeholder="09xx-xxx-xxx" maxlength="20"></label>
          </div>
          <p class="msg err" id="reg-msg" role="alert" hidden></p>
          <button type="submit" class="btn btn-outline" style="letter-spacing:.24em">建立帳號</button>
        </form>
      </section>
    </div>
  </div>
</main>
<script type="module">
  import { api, auth, showMsg, $ } from './assets/js/api.js?v=20261107b';
  import { renderLayout } from './assets/js/layout.js?v=20261107b';
  renderLayout('');

  const next = new URLSearchParams(location.search).get('next');
  const safeNext = next && /^[\w\-]+\.html(\?[\w=&%\-]*)?$/.test(next) ? next : null;
  const go = (m) => { location.href = safeNext || (m.role === 'admin' ? 'admin.html' : 'index.html'); };

  $('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      const { token, member } = await api('/login', { method: 'POST', body: { email: f.email.value, password: f.password.value } });
      auth.save(token, member);
      go(member);
    } catch (err) { showMsg($('#login-msg'), err.message); }
  });

  $('#reg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      const { token, member } = await api('/register', { method: 'POST', body: {
        mName: f.mName.value, email: f.email.value, password: f.password.value, birthday: f.birthday.value || null, phone: f.phone.value } });
      auth.save(token, member);
      go(member);
    } catch (err) { showMsg($('#reg-msg'), err.message); }
  });
</script>
</body>
</html>
